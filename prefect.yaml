name: portfolio_projects
prefect-version: 3.4.22

pull:
- prefect.deployments.steps.git_clone:
    id: clone-step
    repository: https://github.com/philipharman/portfolio_projects.git
    branch: main
- prefect.deployments.steps.pip_install_requirements:
    directory: "{{ clone-step.directory }}"
    requirements_file: requirements.txt

deployments:

- name: weather-deployment
  entrypoint: sdg_bill_tracking/testing/weather.py:fetch_weather
  path: "{{ clone-step.directory }}"
  work_pool:
    name: my-work-pool
    work_queue_name: default
  schedule: {}

- name: sdg-bill-tagging
  entrypoint: sdg_bill_tracking/bill_tagging/bill_processing_main.py:bill_processing_main
  path: "{{ clone-step.directory }}"
  work_pool:
    name: my-work-pool
    work_queue_name: default
  schedule:
    cron: "0 10 * * 0" # Sunday at 10am